name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q

  static:
    name: static (3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff "mypy==1.17.1"
      - run: ruff check universal_research_mcp
      - run: mypy --no-incremental universal_research_mcp

  smoke:
    name: smoke (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            validate_wheel: true
          - os: macos-latest
            python: "3.12"
            validate_wheel: false
          - os: windows-latest
            python: "3.12"
            validate_wheel: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - if: matrix.validate_wheel
        run: python scripts/validate_distribution_artifact.py dist/*.whl
      - run: python scripts/ci_smoke.py dist/*.whl

  urmcp-alias:
    name: urmcp alias package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build "mcp>=1.27,<2"
      - run: python -m build --no-isolation --wheel --outdir core-dist
      - run: python -m build --no-isolation --wheel packages/urmcp --outdir alias-dist
      - run: python scripts/validate_urmcp_alias_artifact.py alias-dist/*.whl
      - run: python -m venv --system-site-packages .urmcp-alias-venv
      - run: .urmcp-alias-venv/bin/python -m pip install --no-deps core-dist/*.whl alias-dist/*.whl
      - run: .urmcp-alias-venv/bin/urmcp --version

  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    needs: [tests, static, smoke, urmcp-alias]
    if: always()
    steps:
      - name: Require every matrix and static gate
        env:
          TESTS: ${{ needs.tests.result }}
          STATIC: ${{ needs.static.result }}
          SMOKE: ${{ needs.smoke.result }}
          URMCP_ALIAS: ${{ needs.urmcp-alias.result }}
        run: test "$TESTS" = success && test "$STATIC" = success && test "$SMOKE" = success && test "$URMCP_ALIAS" = success
