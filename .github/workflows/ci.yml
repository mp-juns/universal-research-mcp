name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package, test, and build dependencies
        run: python -m pip install ".[test]" build
      - name: Run the complete test suite
        run: python -m pytest -q
      - name: Build and inspect distribution artifacts
        run: |
          python -m build
          python scripts/validate_distribution_artifact.py dist/*.whl
      - name: Install the wheel and initialize a fresh project
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/universal-research-wheel-venv"
          "$RUNNER_TEMP/universal-research-wheel-venv/bin/python" -m pip install --no-deps --force-reinstall dist/*.whl
          "$RUNNER_TEMP/universal-research-wheel-venv/bin/universal-research" --version
          "$RUNNER_TEMP/universal-research-wheel-venv/bin/universal-research-mcp" --version
          "$RUNNER_TEMP/universal-research-wheel-venv/bin/universal-research" --help
          "$RUNNER_TEMP/universal-research-wheel-venv/bin/universal-research" init "$RUNNER_TEMP/universal-research-smoke"
          "$RUNNER_TEMP/universal-research-wheel-venv/bin/universal-research" doctor --root "$RUNNER_TEMP/universal-research-smoke"
