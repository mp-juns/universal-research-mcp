name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Verify installable entry point
        run: universal-research-mcp --version
      - name: Run core and read-only MCP fixtures
        run: |
          python -m unittest discover -s tests -p 'test_contract_files.py'
          python -m unittest discover -s tests -p 'test_core_ledger.py'
          python -m unittest discover -s tests -p 'test_framework_operations.py'
          python -m unittest discover -s tests -p 'test_public_distribution.py'
          python -m unittest discover -s tests -p 'test_research_memory_mcp.py'
          python -m unittest discover -s tests -p 'test_research_memory_server.py'
          python -m unittest discover -s tests -p 'test_research_memory_e2e.py'
          python -m pytest -q tests/test_build_research_ledger_index.py
