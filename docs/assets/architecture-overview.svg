<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title description">
  <title id="title">Universal Research MCP — source integrity and authority boundaries</title>
  <desc id="description">The Codex host calls a three-stage read path: candidate search, exact registered source fetch, and evidence eligibility. The host separately judges relevance, conflicts, and the final claim. Canonical JSONL, original source files, and rebuildable indexes have distinct roles. The separate MCP write path requires an immutable draft, external one-time approval, and a recoverable journaled commit with a shared writer lock.</desc>
  <defs>
    <marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#b9c8df" stroke-width="1.5"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#4973ad" stroke-width="1.5"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 18px; }
      .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 17px; }
    </style>
  </defs>

  <rect width="1440" height="1240" fill="#f3f6fa"/>
  <text x="64" y="64" class="eyebrow" fill="#146e65">UNIVERSAL RESEARCH MCP / v0.8.4</text>
  <text x="64" y="124" font-size="43" font-weight="750" fill="#14243b">Evidence stays tied to its source.</text>
  <text x="64" y="166" font-size="24" fill="#53647b">The server checks identity and integrity. The host judges meaning.</text>
  <rect x="64" y="206" width="440" height="48" rx="24" fill="#e2eaf5"/>
  <text x="87" y="237" font-size="20" font-weight="600" fill="#2d496f">Codex host → scoped MCP request</text>
  <text x="1376" y="237" text-anchor="end" class="small" fill="#53647b">Read path and write authority are separate</text>

  <rect x="64" y="284" width="948" height="358" rx="22" fill="#14243b"/>
  <text x="88" y="327" class="eyebrow" fill="#9fb5d2">01 / READ PATH</text>
  <text x="88" y="360" class="body" fill="#f4f7ff">MCP boundary · deterministic source and eligibility checks</text>

  <rect x="88" y="389" width="280" height="179" rx="14" fill="#ffffff"/>
  <text x="108" y="425" class="small" font-weight="700" fill="#64768e">01</text>
  <text x="108" y="462" class="label" fill="#17283f">Search</text>
  <text x="108" y="497" class="body" fill="#53647b">Candidates, not proof</text>
  <text x="108" y="535" class="mono" fill="#245d9f">candidate_only: true</text>
  <path d="M373 478 H387" stroke="#b9c8df" stroke-width="2" marker-end="url(#arrow-light)"/>

  <rect x="394" y="389" width="280" height="179" rx="14" fill="#e1f4ee"/>
  <text x="414" y="425" class="small" font-weight="700" fill="#307566">02</text>
  <text x="414" y="462" font-size="23" font-weight="700" fill="#124e44">Fetch exact source</text>
  <text x="414" y="497" class="body" fill="#235f54">Registered line range</text>
  <text x="414" y="535" class="body" fill="#235f54">Current SHA-256</text>
  <path d="M679 478 H693" stroke="#b9c8df" stroke-width="2" marker-end="url(#arrow-light)"/>

  <rect x="700" y="389" width="288" height="179" rx="14" fill="#ffffff"/>
  <text x="720" y="425" class="small" font-weight="700" fill="#64768e">03</text>
  <text x="720" y="462" class="label" fill="#17283f">Check eligibility</text>
  <text x="720" y="497" class="body" fill="#53647b">Policy + valid evidence</text>
  <text x="720" y="535" class="mono" fill="#245d9f">eligible ≠ claim true</text>

  <text x="88" y="611" font-size="20" fill="#c9d6e7">Bound reference: event ID + source path + registered lines + source hash</text>
  <path d="M1019 478 H1046" stroke="#4973ad" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="1056" y="284" width="320" height="358" rx="22" fill="#e2eaf5" stroke="#c7d4e7"/>
  <text x="1080" y="327" class="eyebrow" fill="#315e96">HOST REVIEW</text>
  <text x="1080" y="373" font-size="29" font-weight="750" fill="#172f52">Does it support</text>
  <text x="1080" y="412" font-size="29" font-weight="750" fill="#172f52">this claim?</text>
  <text x="1080" y="462" class="body" fill="#37516f">Relevance and meaning</text>
  <text x="1080" y="496" class="body" fill="#37516f">Conflicting evidence</text>
  <path d="M1080 523 H1352" stroke="#c0cfe3"/>
  <text x="1080" y="558" class="body" font-weight="650" fill="#172f52">Answer or abstain</text>
  <text x="1080" y="606" class="small" fill="#53647b">Outside the integrity check</text>

  <text x="64" y="694" class="eyebrow" fill="#53647b">02 / DATA ROLES</text>
  <rect x="64" y="718" width="424" height="168" rx="18" fill="#ffffff" stroke="#dbe3ed"/>
  <rect x="64" y="741" width="5" height="120" rx="2.5" fill="#266d67"/>
  <text x="88" y="758" class="label" fill="#17283f">Canonical event ledger</text>
  <text x="88" y="798" class="body" fill="#266d67">Append-only JSONL</text>
  <text x="88" y="838" class="small" fill="#53647b">History and registered references</text>

  <rect x="512" y="718" width="424" height="168" rx="18" fill="#ffffff" stroke="#dbe3ed"/>
  <text x="536" y="758" class="label" fill="#17283f">Original source files</text>
  <text x="536" y="798" class="body" fill="#266d67">Re-read before use</text>
  <text x="536" y="838" class="small" fill="#53647b">Exact lines · current file revision</text>

  <rect x="960" y="718" width="416" height="168" rx="18" fill="#ffffff" stroke="#dbe3ed"/>
  <text x="984" y="758" class="label" fill="#17283f">Derived search indexes</text>
  <text x="984" y="798" class="body" fill="#53647b">SQLite / FTS / optional dense</text>
  <text x="984" y="838" class="small" fill="#53647b">Rebuildable; never the authority</text>

  <rect x="64" y="936" width="1312" height="222" rx="22" fill="#ffffff" stroke="#c7d4e7"/>
  <text x="88" y="979" class="eyebrow" fill="#53647b">03 / SEPARATE MCP WRITE PATH</text>
  <rect x="88" y="1004" width="326" height="73" rx="12" fill="#f0f4f9"/>
  <text x="110" y="1048" class="label" fill="#17283f">Prepare immutable draft</text>
  <path d="M420 1040 H438" stroke="#4973ad" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="446" y="1004" width="362" height="73" rx="12" fill="#e1f4ee"/>
  <text x="467" y="1048" class="label" fill="#124e44">External human approval</text>
  <path d="M814 1040 H832" stroke="#4973ad" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="840" y="1004" width="512" height="73" rx="12" fill="#e2eaf5"/>
  <text x="862" y="1048" class="label" fill="#172f52">Commit the bound transaction</text>
  <text x="88" y="1112" font-size="20" fill="#53647b">One-time receipt · exact hashes · shared CLI/MCP writer lock · journal</text>
  <text x="88" y="1140" class="small" fill="#53647b">Interrupted multi-file commits require recovery; they are not a cross-file atomic transaction.</text>

  <text x="64" y="1200" class="small" fill="#53647b">Identity and integrity are checked. Source truth and claim meaning are not proved.</text>
  <text x="1376" y="1200" text-anchor="end" class="small" fill="#53647b">Portfolio baseline · feature freeze</text>
</svg>
