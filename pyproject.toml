[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-research-mcp"
version = "0.1.0"
description = "Source-grounded, append-only research operations framework and read-only MCP retrieval layer."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "mp-juns"}]
keywords = ["mcp", "research", "provenance", "audit", "reproducibility"]
dependencies = ["mcp>=1.27,<2"]

[project.optional-dependencies]
test = ["jsonschema>=4.25", "pytest>=8"]

[project.scripts]
universal-research-mcp = "universal_research_mcp.server:main"

[tool.setuptools]
packages = ["adapters", "core", "universal_research_mcp"]
